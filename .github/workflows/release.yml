name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Download model
        run: |
          uv run python scripts/converts.py

      - name: Check syntax
        run: uv run python -m py_compile acelingo.py

      - name: Create dist
        run: |
          mkdir -p dist
          cp acelingo.py dist/
          cp pyproject.toml dist/
          cp -r en-zh-int8 dist/
          cp -r scripts dist/
          tar -czf AceLingo-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AceLingo-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
