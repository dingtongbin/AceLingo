name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka ordered-set

      - name: Build EXE
        run: uv run python -m nuitka --standalone --onefile --windows-console-mode=disable --windows-icon-from-ico=logo.ico --include-data-dir=en-zh-int8=en-zh-int8 --include-data-files=logo.ico=logo.ico --company-name=dingtongbin --product-name=AceLingo --file-version=0.1.0 --product-version=0.1.0 --enable-plugin=pyside6 --nofollow-import-to=tkinter,unittest,xmlrpc,pydoc,doctest,lib2to3,ensurepip,idlelib,test,tests,setuptools,pip,wheel,distutils,matplotlib,PIL,cv2,torch,tensorflow,scipy,pandas --assume-yes-for-downloads --output-filename=AceLingo.exe acelingo.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AceLingo.exe
          generate_release_notes: false

      - name: Build MSIX
        run: |
          mkdir -p msix_root
          copy dist\AceLingo.exe msix_root\
          copy LICENSE msix_root\
          copy logo.png msix_root\
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="AceLingo" Publisher="CN=dingtongbin" Version="0.1.0.0" />
            <Properties>
              <DisplayName>AceLingo</DisplayName>
              <PublisherDisplayName>dingtongbin</PublisherDisplayName>
              <Logo>logo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="App" Executable="AceLingo.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="AceLingo" Description="本地翻译工具" BackgroundColor="transparent" Square150x150Logo="logo.png" Square44x44Logo="logo.png" />
              </Application>
            </Applications>
          </Package>
          "@
          $manifest | Out-File -Encoding utf8 msix_root\AppxManifest.xml

      - name: Create MSIX package
        run: |
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $makeAppx = Join-Path $sdkPath "x64\MakeAppx.exe"
          & $makeAppx pack /d msix_root /p AceLingo.msix /o

      - name: Upload MSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceLingo-windows-msix
          path: AceLingo.msix

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install Nuitka
        run: uv pip install nuitka ordered-set

      - name: Build Linux binary
        run: uv run python -m nuitka --standalone --onefile --linux-icon=logo.png --include-data-dir=en-zh-int8=en-zh-int8 --include-data-files=logo.png=logo.png --enable-plugin=pyside6 --nofollow-import-to=tkinter,unittest,xmlrpc,pydoc,doctest,lib2to3,ensurepip,idlelib,test,tests,setuptools,pip,wheel,distutils,matplotlib,PIL,cv2,torch,tensorflow,scipy,pandas --assume-yes-for-downloads --output-filename=AceLingo acelingo.py

      - name: Upload Linux binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AceLingo
          generate_release_notes: true
