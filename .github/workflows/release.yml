name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller and UPX
        run: |
          uv pip install pyinstaller
          # 下载 UPX
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip" -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath .
          Move-Item upx-4.2.4-win64\upx.exe .

      - name: Build EXE
        run: uv run pyinstaller --clean acelingo.spec

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AceLingo.exe
          generate_release_notes: false

      - name: Build MSIX
        run: |
          mkdir -p msix_root
          copy dist\AceLingo.exe msix_root\
          copy LICENSE msix_root\
          copy logo.png msix_root\
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="AceLingo" Publisher="CN=dingtongbin" Version="0.1.0.0" />
            <Properties>
              <DisplayName>AceLingo</DisplayName>
              <PublisherDisplayName>dingtongbin</PublisherDisplayName>
              <Logo>logo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="App" Executable="AceLingo.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="AceLingo" Description="本地翻译工具" BackgroundColor="transparent" Square150x150Logo="logo.png" Square44x44Logo="logo.png" />
              </Application>
            </Applications>
          </Package>
          "@
          $manifest | Out-File -Encoding utf8 msix_root\AppxManifest.xml

      - name: Create MSIX package
        run: |
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          $makeAppx = Join-Path $sdkPath "x64\MakeAppx.exe"
          & $makeAppx pack /d msix_root /p AceLingo.msix /o

      - name: Upload MSIX as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AceLingo-windows-msix
          path: AceLingo.msix

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller and UPX
        run: |
          uv pip install pyinstaller
          wget -q https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xf upx-4.2.4-amd64_linux.tar.xz
          mv upx-4.2.4-amd64_linux/upx .

      - name: Build Linux binary
        run: uv run pyinstaller --clean acelingo.spec

      - name: Upload Linux binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AceLingo
          generate_release_notes: true
